<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bai9A</title>
</head>

<body>
    <script language="JavaScript">
        var Soluong, x;
        var DS = new Array(100);//khai báo mảng DS, có thể lưu tối đa 100 phần tử

        soluong = prompt("bạn cần nhập bao nhiêu người: ", 5);
        for (i = 0; i < soluong; i++) {
            DS[i] = prompt("nhập họ và tên:", "");
        }
        //Gọi hàm sort của đối tượng mảng DS để sắp xếp
        DS.sort();
        //hiển thị kết quả sau khi sắp (sort)
        document.write("<h1<Danh sách đã sắp xếp là </h1>");
        for (x in DS) {
            document.write(DS[x]);
            document.write("<BR>");
        }

    </script>
</body>

</html>
