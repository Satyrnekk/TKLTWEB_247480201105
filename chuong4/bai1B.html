<!doctype html>
<html>

<head>
  <title>Bài tập JavaScript 1B</title>
</head>

<body>
  <script>

    var hoten = prompt("Nhập vào họ tên sinh viên:", "");
    var lop = prompt("Nhập vào lớp học:", "");


    document.write("<h1 style='color: red;'>TRƯỜNG ĐẠI HỌC BẠC LIÊU</h1>"); // style="màu"(đặt màu cho h1)
    document.write("<h2 style='color: blue;'>KHOA CÔNG NGHỆ THÔNG TIN</h2>");//style="màu"(đặt màu cho h1)
    document.write("<font size='4' color='black'><b>Lớp học: " + lop + "</b></font><br>",);
    //font size="kích cỡ" color="màu" đặt dạng cho văn bản kích cỡ và màu
    document.write("<font size='4' color='green'>Họ tên sinh viên: " + hoten + "</font>",);
  </script>
</body>

</html>
